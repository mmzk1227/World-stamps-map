<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>世界探訪スタンプ帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --ink:#20293A; --panel:rgba(251,246,236,0.97); --panel-solid:#FBF6EC;
    --bg:#F3EAD8; --muted:#6E6250; --gold:#B9812E; --gold-deep:#8A5C1E;
    --gold-soft:#E9CB92; --danger:#A9432F; --line:#D8C9A6;
    --shadow:rgba(30,22,10,0.22); --shadow-heavy:rgba(20,14,4,0.38);
  }
  @media (prefers-color-scheme:dark) {
    :root:not([data-theme="light"]) {
      --ink:#EDE6D6; --panel:rgba(27,35,51,0.97); --panel-solid:#1B2333;
      --bg:#121722; --muted:#9AA1B0; --gold:#E0A94F; --gold-deep:#F2C878;
      --gold-soft:#3A2E1C; --danger:#E0846F; --line:#2C3546;
      --shadow:rgba(0,0,0,0.5); --shadow-heavy:rgba(0,0,0,0.7);
    }
  }
  :root[data-theme="dark"] {
    --ink:#EDE6D6; --panel:rgba(27,35,51,0.97); --panel-solid:#1B2333;
    --bg:#121722; --muted:#9AA1B0; --gold:#E0A94F; --gold-deep:#F2C878;
    --gold-soft:#3A2E1C; --danger:#E0846F; --line:#2C3546;
    --shadow:rgba(0,0,0,0.5); --shadow-heavy:rgba(0,0,0,0.7);
  }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; overflow:hidden;
    font-family:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
    -webkit-tap-highlight-color:transparent; }
  #map { position:fixed; inset:0; width:100%; height:100%; z-index:0; }
  .leaflet-control-attribution { display:none; }

  .top-bar {
    position:fixed; top:env(safe-area-inset-top,0px); left:0; right:0;
    z-index:20; padding:12px 14px 0; pointer-events:none;
    display:flex; flex-direction:column; gap:8px;
  }
  .top-row { display:flex; gap:8px; pointer-events:auto; }
  .search-wrap {
    flex:1; background:var(--panel); border-radius:999px;
    display:flex; align-items:center; padding:0 14px; gap:8px;
    box-shadow:0 2px 12px var(--shadow); border:1px solid var(--line); height:44px;
  }
  .search-wrap input {
    flex:1; border:none; background:transparent;
    font-size:14px; font-family:inherit; color:var(--ink); outline:none;
  }
  .search-wrap input::placeholder { color:var(--muted); }
  .fab {
    width:44px; height:44px; border-radius:50%; background:var(--panel);
    border:1px solid var(--line); box-shadow:0 2px 12px var(--shadow);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; cursor:pointer; flex:none; color:var(--ink); transition:transform .15s;
  }
  .fab:active { transform:scale(0.92); }
  .chip-row {
    display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;
    -ms-overflow-style:none; scrollbar-width:none; pointer-events:auto;
  }
  .chip-row::-webkit-scrollbar { display:none; }
  .chip {
    flex:none; background:var(--panel); border:1px solid var(--line);
    border-radius:999px; padding:6px 13px; font-size:12.5px; color:var(--muted);
    cursor:pointer; font-family:inherit; white-space:nowrap; box-shadow:0 1px 6px var(--shadow);
  }
  .chip.active { background:var(--ink); color:var(--bg); border-color:var(--ink); }

  .progress-pill {
    position:fixed; bottom:calc(24px + env(safe-area-inset-bottom,0px)); left:14px;
    z-index:20; background:var(--panel); border:1px solid var(--line);
    border-radius:999px; padding:8px 14px; box-shadow:0 2px 12px var(--shadow);
    display:flex; align-items:center; gap:10px; min-width:170px;
  }
  .progress-emoji { font-size:18px; }
  .progress-label { font-size:11px; color:var(--muted); }
  .progress-count { font-family:'Fraunces',serif; font-weight:700; font-size:15px; color:var(--gold-deep); line-height:1; }
  .progress-bar-wrap { width:70px; height:5px; background:var(--line); border-radius:99px; overflow:hidden; }
  .progress-bar-fill { height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-deep)); border-radius:99px; transition:width .5s ease; }

  .overlay {
    position:fixed; inset:0; background:rgba(10,8,4,0.38);
    opacity:0; pointer-events:none; transition:opacity .22s; z-index:40;
  }
  .overlay.show { opacity:1; pointer-events:auto; }

  .sidebar {
    position:fixed; top:0; right:0; bottom:0; width:min(340px,88vw);
    z-index:50; background:var(--panel-solid); box-shadow:-6px 0 28px var(--shadow-heavy);
    transform:translateX(105%); transition:transform .26s cubic-bezier(.3,.8,.3,1);
    display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px);
  }
  .sidebar.open { transform:translateX(0); }
  .sidebar-head {
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 18px 14px; border-bottom:1px solid var(--line); flex:none;
  }
  .sidebar-title { font-family:'Fraunces',serif; font-size:20px; font-weight:700; }
  .icon-btn { border:none; background:transparent; color:var(--muted); font-size:20px; cursor:pointer; padding:4px; }
  .sidebar-body { flex:1; overflow-y:auto; padding:18px; }
  .section-label {
    font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted); margin-bottom:10px; margin-top:20px;
  }
  .section-label:first-child { margin-top:0; }

  .stamp-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .stamp-cell {
    aspect-ratio:1; border-radius:10px; display:flex; align-items:center;
    justify-content:center; font-size:17px; background:var(--bg);
    border:1px solid var(--line); opacity:.28;
  }
  .stamp-cell.on {
    opacity:1; background:radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold));
    border-color:var(--gold-deep); cursor:pointer;
  }
  .stamp-cell.on:active { transform:scale(.93); }

  .setting-row {
    display:flex; align-items:center; gap:12px;
    padding:13px 0; border-bottom:1px solid var(--line);
  }
  .setting-row:last-child { border-bottom:none; }
  .setting-icon { font-size:18px; width:24px; text-align:center; flex:none; }
  .setting-text { flex:1; }
  .setting-name { font-size:14px; }
  .setting-desc { font-size:11.5px; color:var(--muted); margin-top:2px; }
  .switch {
    position:relative; flex:none; width:44px; height:26px; border-radius:99px;
    background:var(--line); border:none; cursor:pointer; transition:background .2s;
  }
  .switch::after {
    content:''; position:absolute; top:3px; left:3px; width:20px; height:20px;
    border-radius:50%; background:var(--panel-solid); box-shadow:0 1px 3px var(--shadow);
    transition:transform .2s;
  }
  .switch.on { background:var(--gold); }
  .switch.on::after { transform:translateX(18px); }
  .reset-btn {
    width:100%; padding:12px; border-radius:12px; border:1px solid var(--danger);
    background:transparent; color:var(--danger); font-size:13.5px;
    font-family:inherit; cursor:pointer; margin-top:8px;
  }

  .sheet {
    position:fixed; left:0; right:0; bottom:0; z-index:45;
    background:var(--panel-solid); border-radius:22px 22px 0 0;
    padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px));
    transform:translateY(110%); transition:transform .28s cubic-bezier(.3,.8,.3,1);
    box-shadow:0 -8px 32px var(--shadow-heavy); max-width:540px; margin:0 auto;
  }
  .sheet.open { transform:translateY(0); }
  .sheet-handle { width:38px; height:4px; background:var(--line); border-radius:99px; margin:0 auto 16px; }
  .sheet-top { display:flex; align-items:flex-start; gap:14px; margin-bottom:12px; }
  .sheet-emoji-big { font-size:40px; flex:none; line-height:1; }
  .sheet-region { font-size:11px; color:var(--muted); }
  .sheet-name { font-family:'Fraunces',serif; font-size:22px; line-height:1.15; margin:3px 0 2px; }
  .sheet-country { font-size:13px; color:var(--muted); }
  .sheet-desc { font-size:14px; line-height:1.65; margin-bottom:18px; }
  .sheet-actions { display:flex; gap:10px; }
  .btn {
    flex:1; border:none; border-radius:13px; padding:13px 14px;
    font-size:15px; font-family:inherit; font-weight:500; cursor:pointer;
  }
  .btn-collect { background:var(--ink); color:var(--bg); }
  .btn-collect.on { background:var(--gold); color:#2a1c07; }
  .btn-close {
    flex:none; padding:13px 18px; background:transparent;
    border:1px solid var(--line); border-radius:13px; color:var(--muted);
    font-size:15px; font-family:inherit; cursor:pointer;
  }

  .confirm-box {
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:60;
    background:var(--panel-solid); border-radius:18px; padding:22px 20px 18px;
    width:min(300px,84vw); box-shadow:0 10px 40px var(--shadow-heavy); display:none;
  }
  .confirm-box.show { display:block; }
  .confirm-box p { font-size:14px; line-height:1.6; margin-bottom:16px; }
  .confirm-row { display:flex; gap:8px; }

  .checkin-box {
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:61;
    background:var(--panel-solid); border-radius:22px; padding:24px 22px 20px;
    width:min(300px,86vw); box-shadow:0 12px 40px var(--shadow-heavy);
    display:none; text-align:center;
  }
  .checkin-box.show { display:block; }
  .checkin-emoji { font-size:44px; margin-bottom:8px; }
  .checkin-name { font-family:'Fraunces',serif; font-size:18px; margin-bottom:4px; }
  .checkin-msg { font-size:13.5px; color:var(--muted); margin-bottom:18px; }

  .toast {
    position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top,0px));
    transform:translate(-50%,-160%); z-index:80;
    background:var(--ink); color:var(--bg); padding:11px 20px;
    border-radius:999px; font-size:13.5px; white-space:nowrap;
    box-shadow:0 6px 20px var(--shadow-heavy);
    transition:transform .32s cubic-bezier(.2,.8,.3,1); pointer-events:none;
  }
  .toast.show { transform:translate(-50%,0); }
</style>
</head>
<body>

<div id="map"></div>

<div class="top-bar">
  <div class="top-row">
    <div class="search-wrap">
      <span>🔍</span>
      <input id="searchInput" type="text" placeholder="名所や国名で検索…">
    </div>
    <button class="fab" id="menuBtn">☰</button>
  </div>
  <div class="chip-row" id="filters"></div>
</div>

<div class="progress-pill">
  <span class="progress-emoji">🧭</span>
  <div class="progress-text">
    <div class="progress-label">スタンプ収集</div>
    <div class="progress-count"><span id="collectedCount">0</span> / <span id="totalCount">0</span></div>
  </div>
  <div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <span class="sidebar-title">🗺️ スタンプ帳</span>
    <button class="icon-btn" id="closeSidebar">✕</button>
  </div>
  <div class="sidebar-body">
    <div class="section-label">コレクション</div>
    <div class="stamp-grid" id="stampGrid"></div>
    <div id="drawerEmpty" style="display:none;font-size:13px;color:var(--muted);line-height:1.7;margin-top:10px;">
      まだスタンプがない。地図上のピンをタップして最初の名所を集めよう！
    </div>

    <div class="section-label">自動チェックイン</div>
    <div class="setting-row">
      <span class="setting-icon">📍</span>
      <div class="setting-text">
        <div class="setting-name">位置情報チェックイン</div>
        <div class="setting-desc" id="geoStatus">オフ — 2km以内に近づくと提案</div>
      </div>
      <button class="switch" id="geoToggle"></button>
    </div>

    <div class="section-label">表示設定</div>
    <div class="setting-row">
      <span class="setting-icon">🌓</span>
      <div class="setting-text"><div class="setting-name">ダークモード</div></div>
      <button class="switch" id="themeToggle"></button>
    </div>

    <div class="section-label">データ</div>
    <button class="reset-btn" id="resetBtn">🗑️ コレクションをリセット</button>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-top">
    <div class="sheet-emoji-big" id="sheetEmoji"></div>
    <div>
      <div class="sheet-region" id="sheetRegion"></div>
      <div class="sheet-name" id="sheetName"></div>
      <div class="sheet-country" id="sheetCountry"></div>
    </div>
  </div>
  <p class="sheet-desc" id="sheetDesc"></p>
  <div class="sheet-actions">
    <button class="btn btn-collect" id="collectBtn"></button>
    <button class="btn-close" id="closeSheet">閉じる</button>
  </div>
</div>

<div class="confirm-box" id="confirmBox">
  <p>集めたスタンプをすべて消去する。元に戻せない。</p>
  <div class="confirm-row">
    <button class="btn-close" id="confirmNo" style="flex:1;border:1px solid var(--line);border-radius:13px;padding:12px;cursor:pointer;font-family:inherit;font-size:14px;background:transparent;color:var(--muted);">キャンセル</button>
    <button class="btn" id="confirmYes" style="background:var(--danger);color:#fff;">消去する</button>
  </div>
</div>

<div class="checkin-box" id="checkinBox">
  <div class="checkin-emoji" id="checkinEmoji"></div>
  <div class="checkin-name" id="checkinName"></div>
  <div class="checkin-msg">近くにいるみたい！チェックインする？</div>
  <div style="display:flex;gap:8px;">
    <button class="btn-close" id="checkinLater" style="flex:1;border:1px solid var(--line);border-radius:13px;padding:12px;cursor:pointer;font-family:inherit;font-size:14px;background:transparent;color:var(--muted);">あとで</button>
    <button class="btn btn-collect" id="checkinYes">チェックイン ✓</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const LANDMARKS = [
  {id:'fuji',name:'富士山',country:'日本',region:'アジア',lat:35.3606,lng:138.7274,emoji:'🗻',desc:'信仰の対象として古くから崇められてきた、日本一の霊峰。'},
  {id:'fushimi',name:'伏見稲荷大社',country:'日本',region:'アジア',lat:34.9671,lng:135.7727,emoji:'⛩️',desc:'山肌を彩る、朱色の千本鳥居が続くトンネル。'},
  {id:'wall',name:'万里の長城',country:'中国',region:'アジア',lat:40.4319,lng:116.5704,emoji:'🧱',desc:'山々を縫うように延びる、人類最大級の建造物。'},
  {id:'terracotta',name:'兵馬俑',country:'中国',region:'アジア',lat:34.3841,lng:109.2785,emoji:'🏺',desc:'始皇帝の陵墓を守る、等身大の陶器の軍団。'},
  {id:'angkor',name:'アンコールワット',country:'カンボジア',region:'アジア',lat:13.4125,lng:103.867,emoji:'🛕',desc:'ジャングルに眠る、クメール王朝の巨大寺院。'},
  {id:'tajmahal',name:'タージ・マハル',country:'インド',region:'アジア',lat:27.1751,lng:78.0421,emoji:'🕌',desc:'亡き皇妃を偲んで建てられた、白亜の廟。'},
  {id:'cappadocia',name:'カッパドキア',country:'トルコ',region:'アジア',lat:38.6431,lng:34.8289,emoji:'🎈',desc:'奇岩の谷を、朝焼けの熱気球が埋め尽くす。'},
  {id:'burj',name:'ブルジュ・ハリファ',country:'アラブ首長国連邦',region:'アジア',lat:25.1972,lng:55.2744,emoji:'🏙️',desc:'雲を突き抜ける、世界一の高さを誇る塔。'},
  {id:'bali',name:'ウルワツ寺院',country:'インドネシア',region:'アジア',lat:-8.4095,lng:115.1889,emoji:'🌴',desc:'断崖に建つ寺院と、棚田が広がるバリ島。'},
  {id:'petra',name:'ペトラ遺跡',country:'ヨルダン',region:'アジア',lat:30.3285,lng:35.4444,emoji:'🏜️',desc:'岩壁を掘り抜いて造られた、バラ色の古代都市。'},
  {id:'eiffel',name:'エッフェル塔',country:'フランス',region:'ヨーロッパ',lat:48.8584,lng:2.2945,emoji:'🗼',desc:'パリの空に描かれた、鉄骨の詩。'},
  {id:'monsaint',name:'モン・サン・ミッシェル',country:'フランス',region:'ヨーロッパ',lat:48.6361,lng:-1.5115,emoji:'🏰',desc:'潮の満ち引きで姿を変える、孤島の修道院。'},
  {id:'colosseum',name:'コロッセオ',country:'イタリア',region:'ヨーロッパ',lat:41.8902,lng:12.4922,emoji:'🏛️',desc:'剣闘士たちの熱狂を今に伝える、円形闘技場。'},
  {id:'venice',name:'ヴェネツィア',country:'イタリア',region:'ヨーロッパ',lat:45.4408,lng:12.3155,emoji:'🚤',desc:'運河が街路の代わりを果たす、水上都市。'},
  {id:'sagrada',name:'サグラダ・ファミリア',country:'スペイン',region:'ヨーロッパ',lat:41.4036,lng:2.1744,emoji:'⛪',desc:'140年以上未完成の、ガウディの傑作。'},
  {id:'bigben',name:'ビッグベン',country:'イギリス',region:'ヨーロッパ',lat:51.5007,lng:-0.1246,emoji:'🕰️',desc:'テムズ川のほとりで、時を刻み続ける時計塔。'},
  {id:'stonehenge',name:'ストーンヘンジ',country:'イギリス',region:'ヨーロッパ',lat:51.1789,lng:-1.8262,emoji:'🪨',desc:'誰が何のために並べたのか、今も謎めく巨石群。'},
  {id:'santorini',name:'サントリーニ島',country:'ギリシャ',region:'ヨーロッパ',lat:36.3932,lng:25.4615,emoji:'🏝️',desc:'白壁と青い屋根が、断崖を彩るエーゲ海の島。'},
  {id:'kremlin',name:'クレムリン',country:'ロシア',region:'ヨーロッパ',lat:55.752,lng:37.6175,emoji:'🏯',desc:'玉ねぎ型の尖塔がそびえる、権力の中枢。'},
  {id:'pyramid',name:'ギザの三大ピラミッド',country:'エジプト',region:'アフリカ',lat:29.9792,lng:31.1342,emoji:'🔺',desc:'4500年の時を超えて、砂漠に立つ王の墓。'},
  {id:'victoria',name:'ヴィクトリアの滝',country:'ザンビア/ジンバブエ',region:'アフリカ',lat:-17.9243,lng:25.8572,emoji:'💦',desc:'「雷鳴のとどろく水煙」と呼ばれる大瀑布。'},
  {id:'kilimanjaro',name:'キリマンジャロ山',country:'タンザニア',region:'アフリカ',lat:-3.0674,lng:37.3556,emoji:'⛰️',desc:'赤道直下にありながら、山頂に雪を戴く山。'},
  {id:'sahara',name:'サハラ砂漠',country:'モロッコ',region:'アフリカ',lat:31.7917,lng:-7.0926,emoji:'🏜️',desc:'果てしなく続く砂丘が織りなす、静寂の海。'},
  {id:'liberty',name:'自由の女神',country:'アメリカ',region:'北アメリカ',lat:40.6892,lng:-74.0445,emoji:'🗽',desc:'新たな地を目指した人々を迎えた、灯の女神。'},
  {id:'grandcanyon',name:'グランドキャニオン',country:'アメリカ',region:'北アメリカ',lat:36.1069,lng:-112.1129,emoji:'🏜️',desc:'大地が2000mの深さまで刻んだ、時の断層。'},
  {id:'niagara',name:'ナイアガラの滝',country:'アメリカ/カナダ',region:'北アメリカ',lat:43.0962,lng:-79.0377,emoji:'🌊',desc:'轟音とともに落ちる、北米屈指の大瀑布。'},
  {id:'goldengate',name:'ゴールデンゲートブリッジ',country:'アメリカ',region:'北アメリカ',lat:37.8199,lng:-122.4783,emoji:'🌉',desc:'霧の中に浮かび上がる、朱色の吊り橋。'},
  {id:'rockies',name:'カナディアンロッキー',country:'カナダ',region:'北アメリカ',lat:51.4968,lng:-115.9281,emoji:'🏔️',desc:'エメラルド色の湖を抱く、氷河の山脈。'},
  {id:'machu',name:'マチュピチュ',country:'ペルー',region:'南アメリカ',lat:-13.1631,lng:-72.545,emoji:'🦙',desc:'雲の上に隠されていた、インカ帝国の空中都市。'},
  {id:'nazca',name:'ナスカの地上絵',country:'ペルー',region:'南アメリカ',lat:-14.739,lng:-75.13,emoji:'✏️',desc:'上空からしか全貌が見えない、砂漠の巨大な絵。'},
  {id:'iguazu',name:'イグアスの滝',country:'アルゼンチン/ブラジル',region:'南アメリカ',lat:-25.6953,lng:-54.4367,emoji:'💧',desc:'275の滝が連なる、「悪魔の喉笛」。'},
  {id:'moai',name:'モアイ像',country:'チリ（イースター島）',region:'南アメリカ',lat:-27.1212,lng:-109.3667,emoji:'🗿',desc:'太平洋の孤島で、海を見つめ続ける巨石像群。'},
  {id:'sydney',name:'シドニー・オペラハウス',country:'オーストラリア',region:'オセアニア',lat:-33.8568,lng:151.2153,emoji:'🎭',desc:'帆のような屋根が輝く、シドニーの象徴。'},
  {id:'uluru',name:'ウルル（エアーズロック）',country:'オーストラリア',region:'オセアニア',lat:-25.3444,lng:131.0369,emoji:'🪨',desc:'荒野に浮かび上がる、巨大な一枚岩。'},
];

const REGIONS=['全部','アジア','ヨーロッパ','アフリカ','北アメリカ','南アメリカ','オセアニア'];
const STORE_KEY='worldStamp.v2.collected', MILESTONE_KEY='worldStamp.v2.milestones';
const GEO_KEY='worldStamp.v2.geo', THEME_KEY='worldStamp.v2.theme';

let collected=new Set(), shownMilestones=new Set();
let activeRegion='全部', searchTerm='', currentLandmark=null;
let map, markers={};

function loadState(){
  try{const c=localStorage.getItem(STORE_KEY);if(c)collected=new Set(JSON.parse(c));
      const m=localStorage.getItem(MILESTONE_KEY);if(m)shownMilestones=new Set(JSON.parse(m));}catch(e){}
}
function saveState(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify([...collected]));
      localStorage.setItem(MILESTONE_KEY,JSON.stringify([...shownMilestones]));}catch(e){}
}

function makeIcon(lm){
  const on=collected.has(lm.id);
  const bg=on?'#B9812E':'rgba(251,246,236,0.95)';
  const border=on?'#8A5C1E':'#b0a080';
  const shadow=on?'0 0 0 3px rgba(185,129,46,0.3),0 2px 8px rgba(0,0,0,0.3)':'0 2px 8px rgba(0,0,0,0.25)';
  return L.divIcon({
    html:`<div style="width:36px;height:36px;border-radius:50%;background:${bg};border:2.5px solid ${border};box-shadow:${shadow};display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;">${lm.emoji}</div>`,
    iconSize:[36,36],iconAnchor:[18,18],className:''
  });
}

function initMap(){
  map=L.map('map').setView([25,15],2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'',minZoom:2,maxZoom:18}).addTo(map);
  renderMarkers();
}

function renderMarkers(){
  if(!map)return;
  Object.values(markers).forEach(m=>map.removeLayer(m));
  markers={};
  LANDMARKS.forEach(lm=>{
    const visible=matches(lm);
    const m=L.marker([lm.lat,lm.lng],{icon:makeIcon(lm),opacity:visible?1:0,interactive:visible}).addTo(map);
    m.on('click',()=>openSheet(lm));
    markers[lm.id]=m;
  });
}
function refreshMarker(lm){if(markers[lm.id])markers[lm.id].setIcon(makeIcon(lm));}

function renderFilters(){
  const el=document.getElementById('filters');el.innerHTML='';
  REGIONS.forEach(r=>{
    const b=document.createElement('button');
    b.className='chip'+(r===activeRegion?' active':'');b.textContent=r;
    b.onclick=()=>{activeRegion=r;renderFilters();renderMarkers();};el.appendChild(b);
  });
}
function matches(lm){
  const rOK=activeRegion==='全部'||lm.region===activeRegion;
  const term=searchTerm.trim().toLowerCase();
  return rOK&&(!term||(lm.name+lm.country).toLowerCase().includes(term));
}
document.getElementById('searchInput').addEventListener('input',e=>{searchTerm=e.target.value;renderMarkers();});

function renderProgress(){
  document.getElementById('collectedCount').textContent=collected.size;
  document.getElementById('totalCount').textContent=LANDMARKS.length;
  document.getElementById('progressFill').style.width=Math.round(collected.size/LANDMARKS.length*100)+'%';
}

function renderStampGrid(){
  const grid=document.getElementById('stampGrid');grid.innerHTML='';
  LANDMARKS.forEach(lm=>{
    const cell=document.createElement('div');const on=collected.has(lm.id);
    cell.className='stamp-cell'+(on?' on':'');cell.textContent=on?lm.emoji:'?';cell.title=on?lm.name:'未収集';
    if(on)cell.onclick=()=>{closeSidebarFn();map.setView([lm.lat,lm.lng],8);openSheet(lm);};
    grid.appendChild(cell);
  });
  document.getElementById('drawerEmpty').style.display=collected.size===0?'block':'none';
}

const overlay=document.getElementById('overlay');
const sidebar=document.getElementById('sidebar');
function openSidebarFn(){renderStampGrid();sidebar.classList.add('open');overlay.classList.add('show');}
function closeSidebarFn(){sidebar.classList.remove('open');if(!sheet.classList.contains('open'))overlay.classList.remove('show');}
document.getElementById('menuBtn').onclick=openSidebarFn;
document.getElementById('closeSidebar').onclick=closeSidebarFn;
overlay.onclick=()=>{closeSidebarFn();closeSheet();};

const sheet=document.getElementById('sheet');
function openSheet(lm){
  currentLandmark=lm;
  document.getElementById('sheetEmoji').textContent=lm.emoji;
  document.getElementById('sheetRegion').textContent=lm.region;
  document.getElementById('sheetName').textContent=lm.name;
  document.getElementById('sheetCountry').textContent=lm.country;
  document.getElementById('sheetDesc').textContent=lm.desc;
  updateCollectBtn();overlay.classList.add('show');sheet.classList.add('open');
}
function closeSheet(){sheet.classList.remove('open');if(!sidebar.classList.contains('open'))overlay.classList.remove('show');currentLandmark=null;}
function updateCollectBtn(){
  if(!currentLandmark)return;const on=collected.has(currentLandmark.id);
  const btn=document.getElementById('collectBtn');
  btn.textContent=on?'✓ 収集済み':'スタンプを集める';
  btn.className='btn btn-collect'+(on?' on':'');
}
document.getElementById('closeSheet').onclick=closeSheet;
document.getElementById('collectBtn').onclick=()=>{
  if(!currentLandmark)return;
  if(collected.has(currentLandmark.id))collected.delete(currentLandmark.id);
  else{collected.add(currentLandmark.id);checkMilestone();}
  saveState();renderProgress();refreshMarker(currentLandmark);updateCollectBtn();
};

function checkMilestone(){
  const pct=Math.round(collected.size/LANDMARKS.length*100);
  [25,50,75,100].forEach(t=>{
    if(pct>=t&&!shownMilestones.has(t)){shownMilestones.add(t);
      showToast(t===100?'🎉 世界を制覇した！全スタンプ収集！':`✨ 収集率 ${t}% 達成！`);}
  });
}

document.getElementById('resetBtn').onclick=()=>document.getElementById('confirmBox').classList.add('show');
document.getElementById('confirmNo').onclick=()=>document.getElementById('confirmBox').classList.remove('show');
document.getElementById('confirmYes').onclick=()=>{
  collected=new Set();shownMilestones=new Set();saveState();
  renderMarkers();renderProgress();renderStampGrid();
  document.getElementById('confirmBox').classList.remove('show');showToast('リセットした');
};

let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800);
}

function applyTheme(dark){
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  document.getElementById('themeToggle').classList.toggle('on',dark);
  try{localStorage.setItem(THEME_KEY,dark?'dark':'light');}catch(e){}
}
document.getElementById('themeToggle').onclick=()=>applyTheme(document.documentElement.getAttribute('data-theme')!=='dark');
try{const s=localStorage.getItem(THEME_KEY);if(s)applyTheme(s==='dark');}catch(e){}

const GEO_RADIUS_KM=2;let geoWatchId=null;const promptedThisSession=new Set();
const geoStatus=document.getElementById('geoStatus'),geoToggle=document.getElementById('geoToggle');
function haversineKm(a,b,c,d){const R=6371,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180;
  const x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function onGeoSuccess(pos){
  const{latitude:la,longitude:lo}=pos.coords;let nearKm=Infinity,nearName='';
  LANDMARKS.forEach(lm=>{const d=haversineKm(la,lo,lm.lat,lm.lng);
    if(d<nearKm){nearKm=d;nearName=lm.name;}
    if(d<=GEO_RADIUS_KM&&!collected.has(lm.id)&&!promptedThisSession.has(lm.id)){promptedThisSession.add(lm.id);openCheckin(lm);}
  });
  geoStatus.textContent=`オン — 最寄り: ${nearName}（${nearKm.toFixed(1)}km）`;
}
function onGeoError(err){
  geoStatus.textContent=err.code===1?'位置情報が許可されなかった':'位置情報を取得できなかった';
  geoToggle.classList.remove('on');try{localStorage.setItem(GEO_KEY,'off');}catch(e){}
}
function startGeo(){if(!('geolocation'in navigator)){geoStatus.textContent='この端末では使えない';return;}
  geoStatus.textContent='位置情報を取得中…';
  geoWatchId=navigator.geolocation.watchPosition(onGeoSuccess,onGeoError,{enableHighAccuracy:true,maximumAge:15000,timeout:20000});}
function stopGeo(){if(geoWatchId!==null)navigator.geolocation.clearWatch(geoWatchId);geoWatchId=null;
  geoStatus.textContent='オフ — 2km以内に近づくと提案';}
geoToggle.onclick=()=>{const on=!geoToggle.classList.contains('on');geoToggle.classList.toggle('on',on);
  try{localStorage.setItem(GEO_KEY,on?'on':'off');}catch(e){}on?startGeo():stopGeo();};
try{if(localStorage.getItem(GEO_KEY)==='on'){geoToggle.classList.add('on');startGeo();}}catch(e){}

const checkinBox=document.getElementById('checkinBox');let checkinTarget=null;
function openCheckin(lm){if(checkinBox.classList.contains('show'))return;checkinTarget=lm;
  document.getElementById('checkinEmoji').textContent=lm.emoji;
  document.getElementById('checkinName').textContent=lm.name;checkinBox.classList.add('show');}
document.getElementById('checkinLater').onclick=()=>{checkinBox.classList.remove('show');checkinTarget=null;};
document.getElementById('checkinYes').onclick=()=>{
  if(checkinTarget&&!collected.has(checkinTarget.id)){
    collected.add(checkinTarget.id);checkMilestone();saveState();renderProgress();refreshMarker(checkinTarget);
    showToast(`🎉 ${checkinTarget.name} にチェックイン！`);}
  checkinBox.classList.remove('show');checkinTarget=null;};

loadState();renderFilters();renderProgress();
window.addEventListener('load',initMap);
</script>
</body>
</html>
